name: Zebec
description: >-
  Zebec is a blockchain-based financial infrastructure network that has been building decentralized
  payments rails since 2021, best known for real-time streaming payments and payroll. Zebec lets money
  move continuously by the second rather than in discrete transactions, powering stablecoin payroll,
  crypto debit cards (Silver, Carbon and Black cards), cross-chain bridging, multisig treasury "Safe"
  management, staking, and a Web3 Super App. The developer surface is delivered as first-party
  TypeScript SDKs published to npm under the @zebec-fintech, @zebec-protocol and @zebec-network scopes,
  spanning Solana (SVM), EVM chains, BNB, NEAR, Stellar, Sui and a cross-chain Wormhole bridge, plus
  card-purchase SDKs and shared core utilities. Zebec reports over $500M in annual payroll volume, 250+
  enterprise clients, 50K+ monthly users and 20+ integrated blockchains with 150+ supported tokens.
